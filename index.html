<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Profile Course</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="sheet">
      <div id="sheet-handle" aria-hidden="true"></div>
      <section id="controls">
        <h1>Profile Course</h1>
        <label class="control">
          <span>Race GPX</span>
          <input type="file" id="gpx-input" accept=".gpx" />
        </label>
        <p class="hint" id="gpx-stats" hidden></p>
        <div id="target-chart"></div>
        <p class="hint" id="start-hint">Tap the map to set a start point.</p>
        <label class="control">
          <span>Radius: <output id="radius-value">5.0</output> km</span>
          <input type="range" id="radius-slider" min="1" max="10" step="0.5" value="5" />
        </label>
        <label class="control">
          <span>Course distance (km)</span>
          <input type="number" id="distance-input" min="1" max="100" step="0.1" />
        </label>
        <div class="control" id="range-control" hidden>
          <span>Match race from–to (km)</span>
          <div class="row">
            <input type="number" id="range-from" min="0" step="0.5" value="0" aria-label="From km" />
            <input type="number" id="range-to" min="0" step="0.5" aria-label="To km" />
          </div>
        </div>
        <label class="control">
          <span>Surface</span>
          <select id="surface-select">
            <option value="road" selected>Road race (paved/gravel)</option>
            <option value="gravel">Gravel</option>
            <option value="trail">Trail</option>
            <option value="any">Any surface</option>
          </select>
        </label>
        <label class="control checkbox">
          <input type="checkbox" id="return-toggle" />
          <span>Return to start</span>
        </label>
        <button id="find-button" disabled>Find course</button>
        <details id="debug-panel">
          <summary class="hint">Debug</summary>
          <label class="control">
            <span>Algorithm</span>
            <select id="algorithm-select">
              <option value="beam" selected>Beam search</option>
              <option value="walk">Random walk (baseline)</option>
            </select>
          </label>
        </details>
      </section>
      <section id="results" hidden></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
